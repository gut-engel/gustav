[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gustav"
version = "0.1.0"
description = "Self-learning local AI with a wake/sleep cycle, run by a single always-on daemon"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=6.0",
    "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
ml = [
    "torch>=2.15",
    "transformers>=5.22",
    "peft>=0.21",
    "trl>=1.17",
    "accelerate>=1.15",
    "bitsandbytes>=0.50",
    "datasets>=5.2",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[project.scripts]
ai = "gustav.cli:main"
gustav = "gustav.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gustav"]
# The model ladder, the default module registry, the documentation source map and the
# default config travel with the package: an installed wheel starting in an empty
# directory has to be able to write a working project.
artifacts = ["src/gustav/data/*.yaml", "src/gustav/hw/*.yaml"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "modules", "profiles", "packaging", "README.md",
           "config.yaml", "daemon.py", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
markers = [
    "gpu: requires a real GPU and model weights",
    "slow: end-to-end tests that start a real daemon process",
]
filterwarnings = ["ignore::DeprecationWarning"]
