# The model ladder: what the planner is allowed to choose from, in order of capability.
#
# Architecture numbers are used to compute parameter counts, KV-cache size and LoRA
# footprints, so they must match the model's config.json. When weights are present on
# disk the loader reads config.json and overrides these (see ladder.ModelSpec.from_hf_config),
# which is why `verified: false` below is not a problem in practice — it only means the
# numbers came from this file rather than from a downloaded model.
#
# Adding a model is a matter of adding an entry. Nothing here is hardcoded elsewhere.

quantizations:
  - id: 4bit-nf4
    label: 4-bit NF4 (bitsandbytes, double quant)
    # Tried first when two quantisations of the same model both fit: QLoRA on NF4 is
    # the best-supported training path and it leaves the most room for adapters.
    preference: 3
    bytes_per_param: 0.55        # 4 bits + quantisation constants
    linear_only: true            # embeddings, lm_head and norms stay in 16-bit
    trainable: true              # QLoRA
    compute_dtype: auto
    # Decode is memory-bandwidth bound; this is the fraction of theoretical bandwidth
    # a transformers + bitsandbytes generate() loop actually achieves. Replaced by a
    # real measurement as soon as the harness can benchmark (stage 3).
    bandwidth_efficiency: 0.22
  - id: 8bit
    label: 8-bit int8 (bitsandbytes)
    preference: 2
    bytes_per_param: 1.07
    linear_only: true
    trainable: true
    compute_dtype: auto
    bandwidth_efficiency: 0.30
  - id: bf16
    label: bfloat16 (no quantisation)
    preference: 1
    bytes_per_param: 2.0
    linear_only: false
    trainable: true
    compute_dtype: bfloat16
    requires_bf16: true
    bandwidth_efficiency: 0.55
  - id: fp16
    label: float16 (no quantisation)
    preference: 1
    bytes_per_param: 2.0
    linear_only: false
    trainable: true
    compute_dtype: float16
    bandwidth_efficiency: 0.55

defaults:
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  seq_len_options: [512, 1024, 2048, 4096, 8192]

models:
